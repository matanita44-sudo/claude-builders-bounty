name: INFINIDIVE CI and Web Pages

on:
  push:
    branches: [main, infinidive-production]
    paths:
      - "infinidive-game/**"
      - ".github/scripts/**"
      - ".github/workflows/infinidive-ci.yml"
  pull_request:
    paths:
      - "infinidive-game/**"
      - ".github/scripts/**"
      - ".github/workflows/infinidive-ci.yml"
  workflow_dispatch:
    inputs:
      run_long_soak:
        description: Run the source-bound 30-minute structural soak
        required: false
        default: false
        type: boolean

concurrency:
  group: infinidive-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_LINUX_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
  GODOT_TEMPLATES_SHA256: "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot
        shell: bash
        run: |
          test "$(tr -d '[:space:]' < infinidive-game/.godot-version)" = "${GODOT_VERSION}"
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  godot.zip" | sha256sum --check --strict
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot
          ./godot --version | grep -F "${GODOT_VERSION}.${GODOT_STATUS}"
      - name: Validate test scene inventory
        shell: bash
        run: python3 .github/scripts/validate_test_inventory.py .
      - name: Validate staged gameplay screenshot contract
        shell: bash
        run: |
          node --check .github/scripts/smoke_web.cjs
          node --check .github/scripts/validate_stage_screenshots.cjs
          node .github/scripts/validate_stage_screenshots.cjs --self-test
      - name: Validate CI evidence guards
        shell: bash
        run: python3 .github/scripts/validate_soak_report.py --self-test
      - name: Validate iOS Info.plist hardening
        shell: bash
        run: |
          python3 .github/scripts/sanitize_ios_plist.py --self-test
          python3 .github/scripts/validate_ios_privacy_manifest.py --self-test
          python3 .github/scripts/validate_ios_app_icons.py --self-test
          python3 .github/scripts/validate_ios_simulator_app.py --self-test
          python3 .github/scripts/validate_ios_simulator_screenshot.py --self-test
          python3 .github/scripts/select_ios_scaffold.py --self-test
      - name: Validate retained 30-minute evidence
        if: >-
          !(github.ref == 'refs/heads/infinidive-production' &&
          ((github.event_name == 'push' && contains(github.event.head_commit.message, '[long-soak]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.run_long_soak)))
        shell: bash
        run: >-
          python3 .github/scripts/validate_soak_report.py
          infinidive-game/artifacts/soak-30m.json
          --minimum-duration=1800
      - name: Parse and import project
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite editor -- ./godot --headless --path infinidive-game --import
      - name: Run headless tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite main -- ./godot --headless --path infinidive-game --scene res://tests/TestRunner.tscn
      - name: Run offline service tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite backend -- ./godot --headless --path infinidive-game --scene res://tests/backend/BackendOfflineTest.tscn
      - name: Run permanent upgrade contract tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite upgrades -- ./godot --headless --path infinidive-game --scene res://tests/upgrades/PermanentUpgradeEngineTest.tscn
      - name: Run tutorial flow tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite tutorial -- ./godot --headless --path infinidive-game --scene res://tests/tutorial/TutorialFlowTest.tscn
      - name: Run authored room mechanics tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite mechanics -- ./godot --headless --path infinidive-game --scene res://tests/rooms/RoomMechanicsTest.tscn
      - name: Run room pattern runtime tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite compiler -- ./godot --headless --path infinidive-game --scene res://tests/rooms/runtime_patterns/RoomPatternRuntimeTest.tscn
      - name: Run room defender effect tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite defender -- ./godot --headless --path infinidive-game --scene res://tests/rooms/defender_effects/RoomDefenderEffectsTest.tscn
      - name: Run live room defender effect tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite defender_live -- ./godot --headless --path infinidive-game --scene res://tests/rooms/defender_effects_live/RoomDefenderEffectsLiveTest.tscn
      - name: Run projectile travel model tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite travel -- ./godot --headless --path infinidive-game --scene res://tests/projectiles/travel_models/ProjectileTravelModelsTest.tscn
      - name: Run live room runtime integration tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite integration -- ./godot --headless --path infinidive-game --scene res://tests/rooms/runtime_integration/RoomRuntimeIntegrationTest.tscn
      - name: Run organ transformation contract tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite organs -- ./godot --headless --path infinidive-game --scene res://tests/organs/OrganTransformationTest.tscn
      - name: Run achievement and contract tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite meta -- ./godot --headless --path infinidive-game --scene res://tests/meta/MetaGoalServiceTest.tscn
      - name: Run procedural audio contract tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite audio -- ./godot --headless --path infinidive-game --scene res://tests/audio/ProceduralAudioTest.tscn
      - name: Run story catalog and progression tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite story -- ./godot --headless --path infinidive-game --scene res://tests/story/StoryServiceTest.tscn
      - name: Run story presentation and first-clear decision tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite story_presentation -- ./godot --headless --path infinidive-game --scene res://tests/story/StoryPresentationTest.tscn
      - name: Run visual regression and accessibility presentation tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite visual -- ./godot --headless --path infinidive-game --scene res://tests/visual/VisualRegressionTest.tscn
      - name: Run bilingual story canon acceptance tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite story_canon -- ./godot --headless --path infinidive-game --scene res://tests/visual/StoryCanonAcceptanceTest.tscn
      - name: Run story overlay presentation tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite story_overlay -- ./godot --headless --path infinidive-game --scene res://tests/tutorial/StoryOverlayTest.tscn
      - name: Run unarmed hero presentation tests
        shell: bash
        run: bash .github/scripts/run_godot_checked.sh --suite player_presentation -- ./godot --headless --path infinidive-game --scene res://tests/player/PlayerPresentationTest.tscn
      - name: Run bounded structural soak smoke
        shell: bash
        run: |
          bash .github/scripts/run_godot_checked.sh --suite soak -- \
            ./godot --headless --path infinidive-game --scene res://tests/soak/SoakTest.tscn -- \
            --duration-seconds=8 --report-stem=soak-ci-8s
          python3 .github/scripts/validate_soak_report.py \
            infinidive-game/artifacts/soak-ci-8s.json --minimum-duration=8
      - name: Verify transactional soak evidence recovery
        shell: bash
        run: bash .github/scripts/test_soak_report_transaction.sh ./godot "${RUNNER_TEMP}"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinidive-test-evidence
          path: |
            infinidive-game/artifacts
            ${{ runner.temp }}/infinidive-test-logs
          if-no-files-found: warn
          retention-days: 14

  web-export:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install verified Godot and export templates
        shell: bash
        run: bash .github/scripts/install_godot.sh
      - name: Export actual Godot project
        shell: bash
        run: |
          mkdir -p build/web
          ./godot --headless --path infinidive-game --export-release Web "${GITHUB_WORKSPACE}/build/web/index.html"
      - name: Validate exported game
        shell: bash
        run: |
          cp infinidive-game/web_pages/privacy.html build/web/privacy.html
          cp infinidive-game/web_pages/support.html build/web/support.html
          cp infinidive-game/web_pages/terms.html build/web/terms.html
          cp infinidive-game/web_pages/notices.html build/web/notices.html
          touch build/web/.nojekyll
          mkdir -p build/pages/infinidive
          cp -a build/web/. build/pages/infinidive/
          touch build/pages/.nojekyll
          bash .github/scripts/validate_web_export.sh build/web build/pages
      - name: Boot exported game in headless Chrome
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "${chrome_bin}" ]]; then
            echo "No Chrome/Chromium binary is available on the runner" >&2
            exit 1
          fi

          python3 -m http.server 4173 --bind 127.0.0.1 --directory build/pages > "${RUNNER_TEMP}/infinidive-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          server_ready=false
          for _ in {1..40}; do
            if curl --silent --show-error --fail http://127.0.0.1:4173/infinidive/index.html > /dev/null; then
              server_ready=true
              break
            fi
            sleep 0.25
          done
          test "${server_ready}" = true

          command -v npm > /dev/null
          playwright_root="${RUNNER_TEMP}/infinidive-playwright"
          evidence_dir="${RUNNER_TEMP}/infinidive-web-smoke"
          npm install --prefix "${playwright_root}" --no-package-lock --no-save --ignore-scripts playwright-core@1.55.0
          INFINIDIVE_CHROME_BIN="${chrome_bin}" \
          INFINIDIVE_PLAYWRIGHT_ROOT="${playwright_root}" \
            node .github/scripts/smoke_web.cjs \
              http://127.0.0.1:4173/infinidive/ \
              "${evidence_dir}" \
              2> "${RUNNER_TEMP}/infinidive-chrome.log"
          node .github/scripts/validate_stage_screenshots.cjs "${evidence_dir}"
      - name: Upload Web smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinidive-web-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/infinidive-web-smoke/infinidive-dom.html
            ${{ runner.temp }}/infinidive-web-smoke/infinidive-before-input.png
            ${{ runner.temp }}/infinidive-web-smoke/infinidive-browser.json
            ${{ runner.temp }}/infinidive-web-smoke/infinidive-browser.png
            ${{ runner.temp }}/infinidive-web-smoke/infinidive-stage-*.png
            ${{ runner.temp }}/infinidive-web-smoke/infinidive-failure-*.png
            ${{ runner.temp }}/infinidive-chrome.log
            ${{ runner.temp }}/infinidive-http.log
          if-no-files-found: warn
          retention-days: 14
      - name: Guard repository-root Pages ownership
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/infinidive-production'
        shell: bash
        run: |
          pages_owner="${GITHUB_REPOSITORY_OWNER,,}"
          pages_repo="${GITHUB_REPOSITORY#*/}"
          pages_root="https://${pages_owner}.github.io/${pages_repo}/"
          status="$(curl --location --silent --show-error --output "${RUNNER_TEMP}/pages-root.html" --write-out '%{http_code}' --max-time 20 "${pages_root}")"
          case "${status}" in
            404)
              echo "Pages root is unclaimed (HTTP 404); deployment remains isolated to /infinidive/."
              ;;
            2*|3*)
              echo "Refusing to replace an existing Pages site at ${pages_root}; merge its root artifact explicitly first." >&2
              exit 1
              ;;
            *)
              echo "Could not prove Pages-root ownership safely (HTTP ${status}); refusing deployment." >&2
              exit 1
              ;;
          esac
      - name: Bind Pages artifact to the tested commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/infinidive-production'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          marker = {
              "commit": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          path = pathlib.Path("build/pages/infinidive/deployment.json")
          path.write_text(json.dumps(marker, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/infinidive-production'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  android-debug:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Java 17 for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install verified Godot and export templates
        shell: bash
        run: bash .github/scripts/install_godot.sh
      - name: Configure Android export tools and debug signing
        shell: bash
        run: bash .github/scripts/configure_android_ci.sh
      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build/android
          ./godot --headless --path infinidive-game --install-android-build-template --export-debug Android "${GITHUB_WORKSPACE}/build/android/infinidive-ci-debug.apk"
          test -s infinidive-game/android/build/build.gradle
          test -s infinidive-game/android/build/gradlew
      - name: Validate Android debug APK
        shell: bash
        run: bash .github/scripts/validate_android_debug.sh build/android/infinidive-ci-debug.apk
      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinidive-android-debug-${{ github.run_attempt }}
          path: build/android/infinidive-ci-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-unsigned-scaffold:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install verified Godot and export templates
        shell: bash
        env:
          GODOT_INSTALL_IOS_TEMPLATE: "1"
        run: bash .github/scripts/install_godot.sh
      - name: Export an ephemeral unsigned iOS scaffold
        shell: bash
        env:
          # This unmistakable non-secret placeholder exists only to let the
          # Linux exporter generate an Xcode scaffold. It is never used to sign.
          INFINIDIVE_CI_FAKE_TEAM_ID: CIEXPORT00
        run: |
          ios_project="$(mktemp -d "${RUNNER_TEMP}/infinidive-ios-project.XXXXXX")"
          ios_output="${RUNNER_TEMP}/infinidive-ios-unsigned-scaffold"
          test ! -e "${ios_output}"
          mkdir -p "${ios_output}"
          cleanup_ios_project() {
            rm -rf -- "${ios_project}"
          }
          trap cleanup_ios_project EXIT

          cp -a infinidive-game/. "${ios_project}/"
          python3 - "infinidive-game/export_presets.cfg" "${ios_project}/export_presets.cfg" <<'PY'
          import os
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1])
          temporary = pathlib.Path(sys.argv[2])
          fake_team_id = os.environ["INFINIDIVE_CI_FAKE_TEAM_ID"]
          if re.fullmatch(r"CI[A-Z0-9]{8}", fake_team_id) is None:
              raise SystemExit("CI Team ID must be an obvious 10-character fake")
          source_text = source.read_text(encoding="utf-8")
          if source_text.count('application/app_store_team_id=""') != 1:
              raise SystemExit("checked-in iOS Team ID must remain blank")
          temporary_text = temporary.read_text(encoding="utf-8")
          if temporary_text.count('application/app_store_team_id=""') != 1:
              raise SystemExit("temporary preset does not have one blank Team ID")
          temporary.write_text(
              temporary_text.replace(
                  'application/app_store_team_id=""',
                  f'application/app_store_team_id="{fake_team_id}"',
                  1,
              ),
              encoding="utf-8",
          )
          PY

          ./godot --headless --path "${ios_project}" --export-release iOS \
            "${ios_output}/INFINIDIVE.xcodeproj"

          test -d "${ios_output}/INFINIDIVE.xcodeproj"
          mapfile -t application_plists < <(
            find "${ios_output}" -type f -name '*-Info.plist' -print | sort
          )
          test "${#application_plists[@]}" -eq 1
          application_plist="${application_plists[0]}"
          python3 .github/scripts/sanitize_ios_plist.py "${application_plist}"
          python3 .github/scripts/sanitize_ios_plist.py --check "${application_plist}"

          python3 .github/scripts/validate_ios_launch_screen.py \
            --preset infinidive-game/export_presets.cfg \
            --project-root infinidive-game \
            --export-root "${ios_output}"

          mapfile -t privacy_manifests < <(
            find "${ios_output}" -type f -name 'PrivacyInfo.xcprivacy' -print | sort
          )
          test "${#privacy_manifests[@]}" -eq 1
          python3 .github/scripts/validate_ios_privacy_manifest.py \
            "${privacy_manifests[0]}"
          python3 - "${application_plist}" <<'PY'
          import pathlib
          import plistlib
          import sys

          application_path = pathlib.Path(sys.argv[1])
          application = plistlib.loads(application_path.read_bytes())
          if application.get("CFBundleIdentifier") != "$(PRODUCT_BUNDLE_IDENTIFIER)":
              raise SystemExit("generated application bundle identifier is unexpected")
          print("Unsigned Linux iOS application plist validation: PASS")
          PY

          grep -Fq "${INFINIDIVE_CI_FAKE_TEAM_ID}" \
            "${ios_output}/INFINIDIVE.xcodeproj/project.pbxproj"
          grep -Fxq 'application/app_store_team_id=""' \
            infinidive-game/export_presets.cfg
          python3 .github/scripts/finalize_ios_scaffold.py \
            --root "${ios_output}" \
            --placeholder-team-id "${INFINIDIVE_CI_FAKE_TEAM_ID}" \
            --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
          python3 .github/scripts/validate_ios_project_metadata.py \
            --root "${ios_output}" \
            --preset infinidive-game/export_presets.cfg
          python3 .github/scripts/validate_ios_app_icons.py \
            --preset infinidive-game/export_presets.cfg \
            --project-root infinidive-game \
            --export-root "${ios_output}"
          python3 .github/scripts/sanitize_ios_plist.py --check "${application_plist}"
          python3 .github/scripts/validate_ios_privacy_manifest.py \
            "${privacy_manifests[0]}"
          test -s "${ios_output}/UNSIGNED_LINUX_EXPORT_EVIDENCE.md"
          sha256sum "${application_plist}" "${privacy_manifests[0]}"
          echo "Sanitized unsigned Linux Xcode scaffold is ready for bounded artifact retention; it is not compile, signing, archive, install, or TestFlight evidence."
      - name: Upload sanitized unsigned iOS Xcode scaffold
        uses: actions/upload-artifact@v4
        with:
          name: infinidive-ios-unsigned-xcode-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infinidive-ios-unsigned-scaffold
          if-no-files-found: error
          retention-days: 14

  ios-xcode-simulator:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/infinidive-production'
    needs: ios-unsigned-scaffold
    runs-on: macos-26-intel
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout the exact tested source
        uses: actions/checkout@v4
      - name: Download source-bound unsigned scaffold candidates from this run
        uses: actions/download-artifact@v4
        with:
          pattern: infinidive-ios-unsigned-xcode-*
          path: ${{ runner.temp }}/infinidive-ios-scaffold-candidates
      - name: Verify Xcode 26, iOS 26 SDK, and downloaded scaffold
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/infinidive-ios-simulator-evidence"
          scaffold_candidates="${RUNNER_TEMP}/infinidive-ios-scaffold-candidates"
          mkdir -p "${evidence_dir}"
          test -d "${scaffold_candidates}"

          scaffold_root="$(python3 .github/scripts/select_ios_scaffold.py \
            --candidates-root "${scaffold_candidates}" \
            --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --current-attempt "${GITHUB_RUN_ATTEMPT}")"
          test -d "${scaffold_root}"

          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          case "${xcode_version}" in
            26|26.*) ;;
            *)
              echo "Expected Xcode 26.x, found ${xcode_version}" >&2
              exit 1
              ;;
          esac
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          case "${simulator_sdk}" in
            26|26.*) ;;
            *)
              echo "Expected the iOS Simulator 26.x SDK, found ${simulator_sdk}" >&2
              exit 1
              ;;
          esac
          xcodebuild -version > "${evidence_dir}/xcode-version.txt"
          xcrun --sdk iphonesimulator --show-sdk-path \
            > "${evidence_dir}/iphonesimulator-sdk-path.txt"

          projects_file="${RUNNER_TEMP}/infinidive-xcode-projects.txt"
          find "${scaffold_root}" -type d -name 'INFINIDIVE.xcodeproj' -print \
            | sort > "${projects_file}"
          test "$(wc -l < "${projects_file}" | tr -d '[:space:]')" = "1"
          xcode_project="$(sed -n '1p' "${projects_file}")"
          test -d "${xcode_project}"
          test -s "${xcode_project}/project.pbxproj"
          test -s "${scaffold_root}/UNSIGNED_LINUX_EXPORT_EVIDENCE.md"
          echo "Downloaded scaffold source/run/attempt binding: PASS"

          simulator_library="${scaffold_root}/INFINIDIVE.xcframework/ios-arm64_x86_64-simulator/libgodot.a"
          test -s "${simulator_library}"
          simulator_library_archs="$(xcrun lipo -archs "${simulator_library}")"
          test "${simulator_library_archs}" = "x86_64"
          printf '%s\n' "${simulator_library_archs}" \
            > "${evidence_dir}/godot-simulator-library-architectures.txt"
          device_library="${scaffold_root}/INFINIDIVE.xcframework/ios-arm64/libgodot.a"
          test -s "${device_library}"
          device_library_archs="$(xcrun lipo -archs "${device_library}")"
          test "${device_library_archs}" = "arm64"
          printf '%s\n' "${device_library_archs}" \
            > "${evidence_dir}/godot-device-library-architectures.txt"

          xcodebuild -project "${xcode_project}" -list -json \
            > "${evidence_dir}/xcode-project-list.json"
          python3 - "${evidence_dir}/xcode-project-list.json" <<'PY'
          import json
          import pathlib
          import sys

          listing = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          project = listing.get("project", {})
          if "INFINIDIVE" not in project.get("targets", []):
              raise SystemExit("downloaded Xcode project has no INFINIDIVE target")
          if "INFINIDIVE" not in project.get("schemes", []):
              raise SystemExit("downloaded Xcode project has no INFINIDIVE scheme")
          print("Downloaded Xcode target/scheme validation: PASS")
          PY

          {
            echo "SCAFFOLD_ROOT=${scaffold_root}"
            echo "XCODE_PROJECT=${xcode_project}"
            echo "IOS_SIM_EVIDENCE_DIR=${evidence_dir}"
            echo "INFINIDIVE_XCODE_VERSION=${xcode_version}"
            echo "INFINIDIVE_SIMULATOR_SDK=${simulator_sdk}"
          } >> "${GITHUB_ENV}"
      - name: Compile the unsigned Release x86_64 Simulator app
        shell: bash
        run: |
          set -euo pipefail
          derived_data="${RUNNER_TEMP}/infinidive-derived-data"
          test ! -e "${derived_data}"
          xcodebuild \
            -project "${XCODE_PROJECT}" \
            -scheme INFINIDIVE \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${derived_data}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ARCHS=x86_64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "${IOS_SIM_EVIDENCE_DIR}/xcodebuild.log"

          shopt -s nullglob
          applications=("${derived_data}"/Build/Products/Release-iphonesimulator/*.app)
          shopt -u nullglob
          test "${#applications[@]}" -eq 1
          simulator_app="${applications[0]}"
          test -d "${simulator_app}"
          python3 .github/scripts/validate_ios_simulator_app.py \
            --app "${simulator_app}" \
            --scaffold "${SCAFFOLD_ROOT}" \
            --platform simulator \
            | tee "${IOS_SIM_EVIDENCE_DIR}/simulator-app-validation.txt"
          echo "IOS_SIM_APP=${simulator_app}" >> "${GITHUB_ENV}"
      - name: Compile the unsigned Release arm64 iPhoneOS app
        shell: bash
        run: |
          set -euo pipefail
          derived_data="${RUNNER_TEMP}/infinidive-device-derived-data"
          test ! -e "${derived_data}"
          xcodebuild \
            -project "${XCODE_PROJECT}" \
            -scheme INFINIDIVE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${derived_data}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "${IOS_SIM_EVIDENCE_DIR}/xcodebuild-device.log"

          shopt -s nullglob
          applications=("${derived_data}"/Build/Products/Release-iphoneos/*.app)
          shopt -u nullglob
          test "${#applications[@]}" -eq 1
          device_app="${applications[0]}"
          test -d "${device_app}"
          python3 .github/scripts/validate_ios_simulator_app.py \
            --app "${device_app}" \
            --scaffold "${SCAFFOLD_ROOT}" \
            --platform device \
            | tee "${IOS_SIM_EVIDENCE_DIR}/device-app-validation.txt"
          echo "IOS_DEVICE_APP=${device_app}" >> "${GITHUB_ENV}"
      - name: Install, launch, and capture on iPhone 16 Pro Max Simulator
        shell: bash
        run: |
          set -euo pipefail
          runtimes_json="${RUNNER_TEMP}/infinidive-simulator-runtimes.json"
          device_types_json="${RUNNER_TEMP}/infinidive-simulator-device-types.json"
          xcrun simctl list runtimes --json > "${runtimes_json}"
          xcrun simctl list devicetypes --json > "${device_types_json}"
          cp "${runtimes_json}" "${IOS_SIM_EVIDENCE_DIR}/simulator-runtimes.json"
          cp "${device_types_json}" "${IOS_SIM_EVIDENCE_DIR}/simulator-device-types.json"

          runtime_id="$(python3 - "${runtimes_json}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidates = []
          for runtime in data.get("runtimes", []):
              version = str(runtime.get("version", ""))
              identifier = str(runtime.get("identifier", ""))
              if runtime.get("isAvailable") is not True:
                  continue
              if not identifier.startswith("com.apple.CoreSimulator.SimRuntime.iOS-26-"):
                  continue
              if re.fullmatch(r"26(?:\.\d+)+", version) is None:
                  continue
              key = tuple(int(part) for part in version.split("."))
              candidates.append((key, identifier))
          if not candidates:
              raise SystemExit("no available iOS 26.x Simulator runtime")
          print(max(candidates)[1])
          PY
          )"
          device_type_id="com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max"
          python3 - "${device_types_json}" "${device_type_id}" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2]
          identifiers = {str(item.get("identifier", "")) for item in data.get("devicetypes", [])}
          if expected not in identifiers:
              raise SystemExit(f"required Simulator device type is unavailable: {expected}")
          print("iPhone 16 Pro Max Simulator device type validation: PASS")
          PY

          simulator_udid=""
          cleanup_simulator() {
            if [[ -n "${simulator_udid}" ]]; then
              xcrun simctl spawn "${simulator_udid}" log show \
                --style compact --last 5m \
                --predicate 'process == "INFINIDIVE" OR senderImagePath CONTAINS "INFINIDIVE"' \
                > "${IOS_SIM_EVIDENCE_DIR}/simulator-cleanup.log" 2>&1 || true
              xcrun simctl shutdown "${simulator_udid}" >/dev/null 2>&1 || true
              xcrun simctl delete "${simulator_udid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_simulator EXIT

          simulator_name="INFINIDIVE-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          simulator_udid="$(xcrun simctl create \
            "${simulator_name}" "${device_type_id}" "${runtime_id}")"
          test -n "${simulator_udid}"
          xcrun simctl boot "${simulator_udid}"
          xcrun simctl bootstatus "${simulator_udid}" -b
          xcrun simctl spawn "${simulator_udid}" defaults write NSGlobalDomain \
            AppleLanguages -array en
          xcrun simctl spawn "${simulator_udid}" defaults write NSGlobalDomain \
            AppleLocale -string en_US
          xcrun simctl shutdown "${simulator_udid}"
          xcrun simctl boot "${simulator_udid}"
          xcrun simctl bootstatus "${simulator_udid}" -b
          xcrun simctl install "${simulator_udid}" "${IOS_SIM_APP}"

          set +e
          launch_output="$(xcrun simctl launch "${simulator_udid}" \
            com.matan.infinidive \
            -AppleLanguages '(en)' \
            -AppleLocale en_US 2>&1)"
          launch_status=$?
          set -e
          printf '%s\n' "${launch_output}" \
            > "${IOS_SIM_EVIDENCE_DIR}/simulator-launch.txt"
          if [[ "${launch_status}" -ne 0 ]]; then
            printf '%s\n' "${launch_output}" >&2
            exit "${launch_status}"
          fi
          app_pid="$(printf '%s\n' "${launch_output}" | awk -F ': ' 'END { print $NF }')"
          case "${app_pid}" in
            ''|*[!0-9]*)
              echo "Could not parse a numeric app PID from simctl launch: ${launch_output}" >&2
              exit 1
              ;;
          esac

          sleep 10
          screenshot="${IOS_SIM_EVIDENCE_DIR}/iphone-16-pro-max-boot.png"
          xcrun simctl io "${simulator_udid}" screenshot "${screenshot}"
          test -s "${screenshot}"
          dimensions="$(sips -g pixelWidth -g pixelHeight "${screenshot}")"
          screenshot_width="$(printf '%s\n' "${dimensions}" | awk '/pixelWidth:/ { print $2 }')"
          screenshot_height="$(printf '%s\n' "${dimensions}" | awk '/pixelHeight:/ { print $2 }')"
          test "${screenshot_width}" = "1320"
          test "${screenshot_height}" = "2868"
          python3 .github/scripts/validate_ios_simulator_screenshot.py "${screenshot}" \
            | tee "${IOS_SIM_EVIDENCE_DIR}/simulator-screenshot-validation.txt"

          xcrun simctl spawn "${simulator_udid}" log show \
            --style compact --last 5m \
            --predicate 'process == "INFINIDIVE" OR senderImagePath CONTAINS "INFINIDIVE"' \
            > "${IOS_SIM_EVIDENCE_DIR}/simulator-app.log" 2>&1
          if grep -Eiq \
            'uncaught exception|fatal error|EXC_BAD_ACCESS|EXC_CRASH|crashed|abort trap' \
            "${IOS_SIM_EVIDENCE_DIR}/simulator-app.log"; then
            echo "High-signal crash/fatal marker found in native Simulator log" >&2
            exit 1
          fi

          xcrun simctl terminate "${simulator_udid}" com.matan.infinidive
          python3 - \
            "${IOS_SIM_EVIDENCE_DIR}/native-simulator-evidence.json" \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" \
            "${INFINIDIVE_XCODE_VERSION}" "${INFINIDIVE_SIMULATOR_SDK}" \
            "${runtime_id}" "${device_type_id}" "${simulator_udid}" \
            "${app_pid}" "${screenshot_width}" "${screenshot_height}" <<'PY'
          import json
          import pathlib
          import sys

          output = pathlib.Path(sys.argv[1])
          evidence = {
              "status": "passed",
              "source_commit": sys.argv[2],
              "run_id": int(sys.argv[3]),
              "run_attempt": int(sys.argv[4]),
              "xcode_version": sys.argv[5],
              "simulator_sdk_version": sys.argv[6],
              "runtime_identifier": sys.argv[7],
              "device_type_identifier": sys.argv[8],
              "simulator_udid": sys.argv[9],
              "application_pid": int(sys.argv[10]),
              "bundle_identifier": "com.matan.infinidive",
              "configuration": "Release",
              "architecture": "x86_64",
              "code_signing_allowed": False,
              "english_locale": "en_US",
              "survived_seconds_before_capture": 10,
              "screenshot_pixels": {
                  "width": int(sys.argv[11]),
                  "height": int(sys.argv[12]),
              },
              "termination_after_capture": "passed",
          }
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("Native iOS Simulator boot/install/launch/capture validation: PASS")
          PY
      - name: Package native Simulator evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          app_archive="${IOS_SIM_EVIDENCE_DIR}/INFINIDIVE-unsigned-simulator.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "${IOS_SIM_APP}" "${app_archive}"
          test -s "${app_archive}"
          device_archive="${IOS_SIM_EVIDENCE_DIR}/INFINIDIVE-unsigned-device.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "${IOS_DEVICE_APP}" "${device_archive}"
          test -s "${device_archive}"
          (
            cd "${IOS_SIM_EVIDENCE_DIR}"
            for evidence_file in *; do
              if [[ -f "${evidence_file}" && "${evidence_file}" != "SHA256SUMS" ]]; then
                shasum -a 256 "${evidence_file}"
              fi
            done
          ) | LC_ALL=C sort -k 2 > "${IOS_SIM_EVIDENCE_DIR}/SHA256SUMS"
          test -s "${IOS_SIM_EVIDENCE_DIR}/SHA256SUMS"
      - name: Upload native iOS Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinidive-ios-simulator-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infinidive-ios-simulator-evidence
          if-no-files-found: warn
          retention-days: 14

  long-soak:
    if: >-
      github.ref == 'refs/heads/infinidive-production' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[long-soak]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_long_soak))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download verified Godot
        shell: bash
        run: |
          test "$(tr -d '[:space:]' < infinidive-game/.godot-version)" = "${GODOT_VERSION}"
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  godot.zip" | sha256sum --check --strict
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot
          ./godot --version | grep -F "${GODOT_VERSION}.${GODOT_STATUS}"
      - name: Import the frozen project
        shell: bash
        run: |
          checked_runner=.github/scripts/run_godot_checked.sh
          bash "${checked_runner}" --suite editor -- ./godot --headless --path infinidive-game --import
      - name: Run and validate the 30-minute structural soak
        shell: bash
        run: |
          checked_runner=.github/scripts/run_godot_checked.sh
          long_manifest="${RUNNER_TEMP}/infinidive-long-soak-suites.tsv"
          rm -f -- \
            infinidive-game/artifacts/soak-30m.json \
            infinidive-game/artifacts/soak-30m.md
          python3 - .github/scripts/test_suites.tsv "${long_manifest}" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          rewritten = []
          for line in source:
              if line.startswith("soak|soak|"):
                  fields = line.split("|")
                  fields[3] = "1950"
                  line = "|".join(fields)
              rewritten.append(line)
          pathlib.Path(sys.argv[2]).write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY
          bash "${checked_runner}" --suite soak --manifest "${long_manifest}" -- \
            ./godot --headless --path infinidive-game --scene res://tests/soak/SoakTest.tscn -- \
            --duration-seconds=1800 --seed=203541 --report-stem=soak-30m
          python3 .github/scripts/validate_soak_report.py \
            infinidive-game/artifacts/soak-30m.json --minimum-duration=1800
      - name: Upload 30-minute soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinidive-soak-30m-${{ github.run_attempt }}
          path: |
            infinidive-game/artifacts/soak-30m.json
            infinidive-game/artifacts/soak-30m.md
            ${{ runner.temp }}/infinidive-test-logs
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/infinidive-production' &&
      needs.web-export.result == 'success' &&
      needs.android-debug.result == 'success' &&
      (needs.long-soak.result == 'success' || needs.long-soak.result == 'skipped')
    needs: [web-export, android-debug, long-soak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: infinidive-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ format('{0}infinidive/', steps.deployment.outputs.page_url) }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ github.token }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  public-smoke:
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/infinidive-production'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for the deployed commit
        shell: bash
        run: |
          public_root="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/infinidive"
          marker_path="${RUNNER_TEMP}/infinidive-deployment.json"
          deployment_ready=false
          for probe in {1..90}; do
            if curl --location --silent --show-error --fail \
              --header 'Cache-Control: no-cache' \
              --max-time 20 \
              --output "${marker_path}" \
              "${public_root}/deployment.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}&probe=${probe}"; then
              if python3 -c \
                'import json, pathlib, sys; marker = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")); attempt = marker.get("run_attempt"); valid_attempt = type(attempt) in (int, str) and str(attempt).isdigit() and 1 <= int(attempt) <= int(sys.argv[4]); valid = marker.get("commit") == sys.argv[2] and str(marker.get("run_id")) == sys.argv[3] and valid_attempt; raise SystemExit(0 if valid else 1)' \
                "${marker_path}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"; then
                deployment_ready=true
                break
              fi
            fi
            sleep 2
          done
          test "${deployment_ready}" = true

          for path in index.html privacy.html support.html terms.html notices.html index.pck index.wasm; do
            curl --location --silent --show-error --fail \
              --max-time 120 \
              --output /dev/null \
              "${public_root}/${path}"
          done
      - name: Boot the public game in headless Chrome
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "${chrome_bin}" ]]; then
            echo "No Chrome/Chromium binary is available on the runner" >&2
            exit 1
          fi

          playwright_root="${RUNNER_TEMP}/infinidive-public-playwright"
          evidence_dir="${RUNNER_TEMP}/infinidive-public-smoke"
          npm install --prefix "${playwright_root}" --no-package-lock --no-save --ignore-scripts playwright-core@1.55.0
          INFINIDIVE_CHROME_BIN="${chrome_bin}" \
          INFINIDIVE_PLAYWRIGHT_ROOT="${playwright_root}" \
            node .github/scripts/smoke_web.cjs \
              "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/infinidive/" \
              "${evidence_dir}" \
              2> "${RUNNER_TEMP}/infinidive-public-chrome.log"
          node .github/scripts/validate_stage_screenshots.cjs "${evidence_dir}"
      - name: Upload public Web smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinidive-public-web-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/infinidive-public-smoke/infinidive-dom.html
            ${{ runner.temp }}/infinidive-public-smoke/infinidive-before-input.png
            ${{ runner.temp }}/infinidive-public-smoke/infinidive-browser.json
            ${{ runner.temp }}/infinidive-public-smoke/infinidive-browser.png
            ${{ runner.temp }}/infinidive-public-smoke/infinidive-stage-*.png
            ${{ runner.temp }}/infinidive-public-smoke/infinidive-failure-*.png
            ${{ runner.temp }}/infinidive-public-chrome.log
            ${{ runner.temp }}/infinidive-deployment.json
          if-no-files-found: warn
          retention-days: 14
